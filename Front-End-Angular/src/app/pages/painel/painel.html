<main class="painel">
  <header>
    <h1>Painel do GitGud</h1>
    <button type="button" (click)="sair()">Sair</button>
  </header>

  @if (sessao(); as usuario) {
    <p class="boas-vindas">Logado como <strong>{{ usuario.name }}</strong> ({{ usuario.role }})</p>
  } @else {
    <p class="boas-vindas">Conferindo a sessão…</p>
  }

  <p class="em-breve">A lista de artigos e o editor entram aqui na próxima etapa.</p>
</main>
