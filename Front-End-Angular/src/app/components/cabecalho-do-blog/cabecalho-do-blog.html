<header class="cabecalho">
  <div class="cabecalho__interno conteudo-central">
    <a class="cabecalho__marca" routerLink="/" aria-label="GitGud, página inicial">
      <img [src]="logo" alt="" width="140" height="36" />
    </a>

    <nav class="cabecalho__navegacao" aria-label="Principal">
      <a routerLink="/sobre" routerLinkActive="esta-ativo">Sobre</a>
    </nav>

    <div class="cabecalho__ferramentas">
      <form class="busca" [class.busca--aberta]="buscaAberta()" (ngSubmit)="buscar()" role="search">
        <label class="apenas-para-leitor-de-tela" for="busca">Buscar no blog</label>
        <input
          id="busca"
          type="search"
          [formControl]="termo"
          placeholder="Buscar artigos…"
          autocomplete="off"
        />
        <button type="submit" class="botao-icone" aria-label="Buscar">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
        </button>
      </form>

      <button type="button" class="botao-icone apenas-no-celular" (click)="alternarBusca()"
              [attr.aria-expanded]="buscaAberta()" aria-label="Abrir busca">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
      </button>

      <a class="botao-icone" [href]="perfilNoGitHub" target="_blank" rel="noopener noreferrer"
         aria-label="Perfil no GitHub (abre em nova aba)">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icone-cheio">
          <path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.5 9.5 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/>
        </svg>
      </a>

      <button type="button" class="botao-icone" (click)="alternarTema()"
              [attr.aria-label]="temaEfetivo() === 'escuro' ? 'Mudar para o tema claro' : 'Mudar para o tema escuro'">
        @if (temaEfetivo() === 'escuro') {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
          </svg>
        }
      </button>
    </div>
  </div>
</header>
