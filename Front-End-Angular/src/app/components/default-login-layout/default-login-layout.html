<main class="entrada">
  <section class="entrada__formulario">
    <div class="cartao">
      <img class="cartao__logo" [src]="logoImage" alt="GitGud" width="200" height="52" />
      <h1 class="cartao__titulo">{{ title() }}</h1>

      <ng-content></ng-content>

      <button
        class="botao botao--primario"
        [type]="formularioId() ? 'submit' : 'button'"
        [attr.form]="formularioId() || null"
        [disabled]="disablePrimaryBtn()"
        (click)="submit()"
      >
        {{ primaryBtnText() }}
      </button>

      @if (secondaryBtnText()) {
        <div class="separador"><span>ou</span></div>
        <button class="botao botao--secundario" type="button" (click)="navigate()">
          {{ secondaryBtnText() }}
        </button>
      }
    </div>
  </section>

  <section class="entrada__marca" aria-hidden="true">
    <div class="entrada__marca-interna">
      <h2>Git Gud, Bruh!</h2>
      <img class="fogueira" [src]="bonfireImage" alt="" />
    </div>
  </section>
</main>
