# Sem este arquivo o ./mvnw morre com "cannot read distributionUrl property".
# distributionType=only-script dispensa o maven-wrapper.jar — por isso ele nao
# existe no repositorio e nao precisa existir.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.zip
