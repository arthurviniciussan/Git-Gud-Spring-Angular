# Nenhum segredo aqui: tudo vem do .env (veja .env.example).
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: ./Back-End-Spring
    environment:
      DATABASE_URL: jdbc:mysql://db:3306/${DATABASE_NAME}?useSSL=false&allowPublicKeyRetrieval=true
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      GITGUD_ADMIN_EMAIL: ${GITGUD_ADMIN_EMAIL}
      GITGUD_ADMIN_NAME: ${GITGUD_ADMIN_NAME}
      GITGUD_ADMIN_PASSWORD_HASH: ${GITGUD_ADMIN_PASSWORD_HASH}
      GITGUD_JWT_SECRET: ${GITGUD_JWT_SECRET}
      GITGUD_CORS_ORIGINS: ${GITGUD_CORS_ORIGINS}
      GITGUD_UPLOADS_DIR: /dados/uploads
    ports:
      - "8080:8080"
    volumes:
      # Sem este volume, toda imagem enviada some quando o container e
      # recriado — e os artigos ficam com as capas quebradas.
      - uploads_data:/dados/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./Front-End-Angular
    ports:
      - "4200:4200"
    volumes:
      # Espelha o codigo para o hot reload funcionar...
      - ./Front-End-Angular:/app
      # ...sem deixar o node_modules do host sobrescrever o do container.
      - /app/node_modules
    depends_on:
      - app

volumes:
  db_data:
  uploads_data:
